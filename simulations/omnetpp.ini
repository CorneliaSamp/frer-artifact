[General]
network = frer_experiments.FRERTestNetwork
sim-time-limit = 1s

*.*.eth[*].bitrate = 1Gbps

*.*.hasStreamRedundancy = true

*.macForwardingTableConfigurator.typename = ""

*.streamRedundancyConfigurator.typename = "StreamRedundancyConfigurator"
*.streamRedundancyConfigurator.configuration = [{name: "FRER_Stream", packetFilter: "*", source: "talker", destination: "listener", trees: [[["talker","S1","S2","S4","listener"]],[["talker","S1","S3","S4","listener"]]]}]


# TALKER  high-rate profile: 1000 fps / 256 B
*.talker.numApps = 1
*.talker.app[0].typename = "UdpSourceApp"
*.talker.app[0].io.destAddress = "listener"
*.talker.app[0].io.destPort = 1000
*.talker.app[0].source.packetLength = 256B
*.talker.app[0].source.productionInterval = 1ms


# LISTENER
listener.numApps = 1
*.listener.app[0].typename = "UdpSinkApp"
*.listener.app[0].io.localPort = 1000
*.listener.eth[*].address = "0A-AA-12-34-56-78"

# ATTACKER -- INACTIVE FOR H0
*.attacker.numApps = 0

# CHECKSUM / FCS
**.checksumMode = "computed"
**.fcsMode = "computed"

[Config H0_VRA]
*.S4.bridging.streamRelay.merger.typename = "Ieee8021cbRecovery"
*.S4.bridging.streamRelay.merger.historyLength = 16
*.S4.bridging.streamRelay.merger.resetTimeout = 1s

[Config CR_B1]
extends = H0_VRA
*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpSourceApp"
*.attacker.app[0].io.destAddress = "listener"
*.attacker.app[0].io.destPort = 2000
*.attacker.app[0].source.packetLength = 256B
*.attacker.app[0].source.productionInterval = 1ms
# identify attacker traffic + encode onto VLAN 0 (R-TAG comes from sequenceNumbering)
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: true}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]
# S3 by default accepts only VLAN 1 at ingress (legit path S1->S3). But the attacker sends
# on VLAN 0 (the same VLAN as the segment S3->S4). So that S3 does not drop the attacker frames
# at ingress right away, also allow VLAN 0. (Whether the configurator overwrites this
# we'll see from the run -- then the fix has to go elsewhere.)
*.S3.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0, 1]


# ============================================================
# [MANUAL] -- same FRER config as H0_VRA, but MANUAL instead of the auto configurator.
#   Reason: the StreamRedundancyConfigurator sets the VLAN filters hard and overwrites
#   our .ini -- so the attacker (off-path at S3 eth2) does not get through. Manual
#   keeps our vlanIdFilter. Values transcribed 1:1 from the H0_VRA run.
#   TEST WITHOUT THE ATTACKER FIRST: must deliver like H0_VRA -> 2000 in / 1000 dropped / 1000 out.
# ============================================================
[Config MANUAL]
extends = H0_VRA
# auto configurator off
*.streamRedundancyConfigurator.typename = ""

# talker: identify (with sequence number)  encode onto VLAN 0 
*.talker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", sequenceNumbering: true, stream: "FRER_Stream"}]
*.talker.bridging.streamCoder.encoder.mapping = [{pcp: -1, stream: "FRER_Stream", vlan: 0}]

# -- S1 decode, split (copy for S2 -> VLAN 0, copy for S3 -> VLAN 1), forward 
*.S1.bridging.streamCoder.decoder.mapping = [{destination: "listener", interface: "eth0", stream: "FRER_Stream", vlan: 0}]
*.S1.bridging.streamRelay.splitter.mapping = {FRER_Stream: ["FRER_Stream_S2", "FRER_Stream_S3"]}
*.S1.bridging.streamCoder.encoder.mapping = [{pcp: -1, stream: "FRER_Stream_S2", vlan: 0}, {pcp: -1, stream: "FRER_Stream_S3", vlan: 1}]
*.S1.macTable.forwardingTable = [{address: "listener", interface: "eth1", vlan: 0}, {address: "listener", interface: "eth2", vlan: 1}]
*.S1.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0]

# -- S2 (path A): in VLAN 0, out VLAN 0 to S4 
*.S2.bridging.streamCoder.decoder.mapping = [{destination: "listener", interface: "eth0", stream: "FRER_Stream", vlan: 0}]
*.S2.bridging.streamCoder.encoder.mapping = [{pcp: -1, stream: "FRER_Stream", vlan: 0}]
*.S2.macTable.forwardingTable = [{address: "listener", interface: "eth1", vlan: 0}]
*.S2.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0]

# - S3 (path B): in VLAN 1 (from S1), out VLAN 0 to S4. vlanIdFilter [0,1]: the 1 for the legit path, the 0 additionally for the attacker port (eth2)
*.S3.bridging.streamCoder.decoder.mapping = [{destination: "listener", interface: "eth0", stream: "FRER_Stream", vlan: 1}]
*.S3.bridging.streamCoder.encoder.mapping = [{pcp: -1, stream: "FRER_Stream", vlan: 0}]
*.S3.macTable.forwardingTable = [{address: "listener", interface: "eth1", vlan: 0}]
*.S3.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0, 1]

# -- S4 (recovery): decode both copies (eth0=S2, eth2=S3), merge, forward to listener 
*.S4.bridging.streamCoder.decoder.mapping = [{destination: "listener", interface: "eth0", stream: "FRER_Stream_S2", vlan: 0}, {destination: "listener", interface: "eth2", stream: "FRER_Stream_S3", vlan: 0}]
*.S4.bridging.streamRelay.merger.mapping = {FRER_Stream_S2: "FRER_Stream", FRER_Stream_S3: "FRER_Stream"}
*.S4.bridging.streamCoder.encoder.mapping = [{pcp: -1, stream: "FRER_Stream", vlan: 0}]
*.S4.macTable.forwardingTable = [{address: "listener", interface: "eth1", vlan: 0}]
*.S4.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0]

# --- listener ---
*.listener.bridging.streamCoder.decoder.mapping = [{destination: "listener", interface: "eth0", stream: "FRER_Stream", vlan: 0}]
*.listener.ieee8021q.qTagHeaderChecker.vlanIdFilter = [0]

[Config CR_manual]
extends = MANUAL
*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpSourceApp"
*.attacker.app[0].io.destAddress = "listener"
*.attacker.app[0].io.destPort = 2000
*.attacker.app[0].source.packetLength = 256B
*.attacker.app[0].source.productionInterval = 1ms
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: true}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]

[Config CR_B2]
extends = MANUAL
*.attacker.numApps = 1
*.attacker.app[0].typename = "FrerInjectorApp"
*.attacker.app[0].destAddresses = "listener"
*.attacker.app[0].destPort = 1000
*.attacker.app[0].messageLength = 100B      # distinct size (legit=256B) -> discriminator at the listener
*.attacker.app[0].sendInterval = 10ms
*.attacker.app[0].productionInterval = 1ms
*.attacker.app[0].offsets = "8"
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: false}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]


[Config CR_d1]
extends = CR_B2
*.attacker.app[0].sendInterval = 2ms
*.attacker.app[0].offsets = "8"             # depth 1: constant offset (s=g), no racing -> 1:1 substitution
*.attacker.app[0].cycleGap = 0s             # no re-anchor -> continuously +8

[Config CR_d2]
extends = CR_B2
*.attacker.app[0].sendInterval = 2ms
*.attacker.app[0].offsets = "8 18"          # depth 2: 1 racing step + 1 re-anchor (s_gt_g=0.50)
*.attacker.app[0].cycleGap = 40ms   # re-anchor pause; HW operating point (PDR~0.87, A_loss~2.4, burst 3). Gap-invariant for A_loss/burst.

[Config CR_d3]
extends = CR_B2
*.attacker.app[0].sendInterval = 2ms
*.attacker.app[0].offsets = "8 18 28"       # depth 3: 2 racing steps + 1 re-anchor (s_gt_g=0.67)
*.attacker.app[0].cycleGap = 52ms   # re-anchor pause; HW operating point (PDR~0.70, A_loss~5.5, burst 15). Gap-invariant for A_loss/burst.

[Config RSD]
extends = MANUAL
sim-time-limit = 1.5s
# --- legit talker: bursty instead of continuous 
*.talker.app[0].typename = "UdpBasicBurst"
*.talker.app[0].destAddresses = "listener"
*.talker.app[0].chooseDestAddrMode = "once"
*.talker.app[0].destPort = 1000
*.talker.app[0].messageLength = 256B
*.talker.app[0].startTime = 0s
*.talker.app[0].sendInterval = 1ms
*.talker.app[0].burstDuration = 100ms     # 100 frames per burst
*.talker.app[0].sleepDuration = 1100ms    # idle > resetTimeout(1s) -> VRA reset
# --- attacker: ONE frame, fixed anchor seq R+Delta 
*.attacker.numApps = 1
*.attacker.app[0].typename = "FrerInjectorApp"
*.attacker.app[0].destAddresses = "listener"
*.attacker.app[0].destPort = 1000
*.attacker.app[0].messageLength = 100B
*.attacker.app[0].productionInterval = 1ms
*.attacker.app[0].timeVarying = false     # fixed anchor seq (no time term)
*.attacker.app[0].seqBase = 99            # R = last accepted pre-idle seq
*.attacker.app[0].offsets = "17"          # Delta; sweepable from the command line
*.attacker.app[0].startTime = 1150ms      # after reset (>1099ms), before burst1 (1200ms)
*.attacker.app[0].sendInterval = 10s      # only 1 frame in the sim window
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: false}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]


# --- A0: no attack (baseline, 1000 fps/256 B) ---
[Config CRHW_A0]
extends = MANUAL
sim-time-limit = 60s
*.attacker.numApps = 0

# --- common attacker base for the 1000-fps attacks ---
[Config CRHW_base]
extends = MANUAL
sim-time-limit = 60s
*.attacker.numApps = 1
*.attacker.app[0].typename = "FrerInjectorApp"
*.attacker.app[0].destAddresses = "listener"
*.attacker.app[0].destPort = 1000
*.attacker.app[0].messageLength = 100B
*.attacker.app[0].productionInterval = 1ms   # 1000 fps -> legitEst = floor(t/1ms)
*.attacker.app[0].startTime = 20s            # ACTIVE window only
*.attacker.app[0].stopTime = 40s
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: false}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]

# -- A1: constant offset +8 @100/s (HW: A_loss=1.0, PDR_active=0.925) 
[Config CRHW_A1]
extends = CRHW_base
*.attacker.app[0].offsets = "8"
*.attacker.app[0].sendInterval = 10ms        # 100/s
*.attacker.app[0].cycleGap = 0s

# -- d2 CR depth 2, HW params "8,18 2ms period30ms"
[Config CRHW_d2]
extends = CRHW_base
*.attacker.app[0].offsets = "8 18"
*.attacker.app[0].sendInterval = 2ms
*.attacker.app[0].cycleGap = 28ms            # cycle period 30ms (= 2ms + 28ms)

# --- d3: CR depth 3, HW params 8,18,28 2ms period50ms 
[Config CRHW_d3]
extends = CRHW_base
*.attacker.app[0].offsets = "8 18 28"
*.attacker.app[0].sendInterval = 2ms
*.attacker.app[0].cycleGap = 46ms            # cycle period 50ms (= 2*2ms + 46ms)

# --- d3 @200fps/512B (cross-profile), HW params "8,18,28 10ms period200ms" 
extends = CRHW_base
*.talker.app[0].source.productionInterval = 5ms   # 200 fps
*.talker.app[0].source.packetLength = 512B
*.attacker.app[0].productionInterval = 5ms        # legitEst @200fps
*.attacker.app[0].offsets = "8 18 28"
*.attacker.app[0].sendInterval = 10ms             # g=2 legit frames @200fps
*.attacker.app[0].cycleGap = 180ms                # cycle period 200ms (= 2*10ms + 180ms)


# --- common bursty legit base ---
[Config RSDHW_base]
extends = MANUAL
sim-time-limit = 60s
*.talker.app[0].typename = "UdpBasicBurst"
*.talker.app[0].destAddresses = "listener"
*.talker.app[0].chooseDestAddrMode = "once"
*.talker.app[0].destPort = 1000
*.talker.app[0].messageLength = 512B
*.talker.app[0].startTime = 0s
*.talker.app[0].sendInterval = 1ms
*.talker.app[0].burstDuration = 100ms
*.talker.app[0].sleepDuration = 1100ms

# --- D0: burst baseline, no attack (HW: legit_RX=5000, PDR=1.0, N_acc=0) 
[Config RSDHW_D0]
extends = RSDHW_base
*.attacker.numApps = 0


[Config RSDHW]
extends = RSDHW_base
*.attacker.numApps = 1
*.attacker.app[0].typename = "FrerInjectorApp"
*.attacker.app[0].destAddresses = "listener"
*.attacker.app[0].destPort = 1000
*.attacker.app[0].messageLength = 100B
*.attacker.app[0].burstSize = 100            # RSD burst mode
*.attacker.app[0].productionInterval = 1.2s  # burst period
*.attacker.app[0].seqBase = 0
*.attacker.app[0].offsets = "8"              # Delta; sweepable from the command line
*.attacker.app[0].startTime = 20.3s          # first reset gap in ACTIVE: burst16, 16*1.2+1.1 (design, not HW-fitted)
*.attacker.app[0].sendInterval = 1.2s        # 1 injection per burst gap
*.attacker.app[0].stopTime = 40s             
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: false}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]

# --- N0: continuous control (1000fps/256B), far-forward injection Delta=20000 -> OOW discard, N_acc=0 ---
[Config RSDHW_N0]
extends = MANUAL
sim-time-limit = 60s
*.attacker.numApps = 1
*.attacker.app[0].typename = "FrerInjectorApp"
*.attacker.app[0].destAddresses = "listener"
*.attacker.app[0].destPort = 1000
*.attacker.app[0].messageLength = 100B
*.attacker.app[0].productionInterval = 1ms
*.attacker.app[0].timeVarying = true
*.attacker.app[0].offsets = "20000"          # far outside -> never accepted (no reset under continuous)
*.attacker.app[0].sendInterval = 10ms
*.attacker.app[0].startTime = 20s
*.attacker.app[0].stopTime = 40s
*.attacker.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*", stream: "AttackStream", sequenceNumbering: false}]
*.attacker.bridging.streamCoder.encoder.mapping = [{stream: "AttackStream", vlan: 0}]

[Config RSDHW_H8]
extends = RSDHW
*.S4.bridging.streamRelay.merger.historyLength = 8

[Config ID_P2]
extends = CR_B2
*.talker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.talker.bridging.streamCoder.encoder.streamSecret = 0
*.S4.bridging.streamCoder.decoder.typename = "StreamIdExtDecoder"
*.S4.bridging.streamCoder.decoder.idBytes = 4
*.S4.bridging.streamRelay.merger.typename = "StreamIdExtRecovery"
*.S4.bridging.streamRelay.merger.streamSecret = 0
*.S4.bridging.streamRelay.merger.attackerMaxBytes = 150
# attacker node: StreamIdExtEncoder in randomId mode -> appends a value guessed from [0,idSpace) at L2
*.attacker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.attacker.bridging.streamCoder.encoder.streamSecret = 0
*.attacker.bridging.streamCoder.encoder.randomId = true
*.attacker.bridging.streamCoder.encoder.idSpace = 1
*.attacker.app[0].blind = true
*.attacker.app[0].seqSpace = 65536
*.attacker.app[0].sendInterval = 20us

extends = CR_d3
*.talker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.talker.bridging.streamCoder.encoder.streamSecret = 0
*.S4.bridging.streamCoder.decoder.typename = "StreamIdExtDecoder"
*.S4.bridging.streamCoder.decoder.idBytes = 4
*.S4.bridging.streamRelay.merger.typename = "StreamIdExtRecovery"
*.S4.bridging.streamRelay.merger.streamSecret = 0
*.attacker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.attacker.bridging.streamCoder.encoder.streamSecret = 0
*.attacker.bridging.streamCoder.encoder.randomId = true
*.attacker.bridging.streamCoder.encoder.idSpace = 1

[Config RSD_IDGATE]
extends = RSD
*.talker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.talker.bridging.streamCoder.encoder.streamSecret = 0
*.S4.bridging.streamCoder.decoder.typename = "StreamIdExtDecoder"
*.S4.bridging.streamCoder.decoder.idBytes = 4
*.S4.bridging.streamRelay.merger.typename = "StreamIdExtRecovery"
*.S4.bridging.streamRelay.merger.streamSecret = 0
*.attacker.bridging.streamCoder.encoder.typename = "StreamIdExtEncoder"
*.attacker.bridging.streamCoder.encoder.streamSecret = 0
*.attacker.bridging.streamCoder.encoder.randomId = true
*.attacker.bridging.streamCoder.encoder.idSpace = 1
